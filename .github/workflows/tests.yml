name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; referencia consultada el 2026-10-27
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; referencia consultada el 2026-10-27
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests de software, sin LLM
        run: python -m unittest discover -s tests -v
      - name: Validar corpus
        run: python -m promptlab inspect
      - name: Reproducir regresiones
        run: python -m scripts.reproduce_findings --expect-fixed
      - name: Verificar evidencias conservadas
        run: python tools/verify_evidence.py
